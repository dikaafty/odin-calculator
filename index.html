<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="calculator.png" type="image/x-icon">
</head>
<body>
  <div class="calculator">

    <div class="display">0</div>

    <div class="button-container">

      <div class="first-row">
        <button onclick="populateDisplay('7')">7</button>
        <button onclick="populateDisplay('8')">8</button>
        <button onclick="populateDisplay('9')">9</button>
        <button class="delete-btn">Delete</button>
      </div>

      <div class="second-row">
        <button onclick="populateDisplay('4')">4</button>
        <button onclick="populateDisplay('5')">5</button>
        <button onclick="populateDisplay('6')">6</button>
        <button onclick="getOp('+')">+</button>
      </div>

    </div>

  </div>
</body>
</html>
